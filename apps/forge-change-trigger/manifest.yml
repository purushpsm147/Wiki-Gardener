modules:
  trigger:
    - key: page-updated-trigger
      function: on-page-updated
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page
  function:
    - key: on-page-updated
      handler: handler.onPageUpdated
    - key: resolver
      handler: resolver.handler
  confluence:contentBylineItem:
    - key: conflict-radar-byline
      resource: main
      resolver:
        function: resolver
      render: native
      title: Conflict Radar
      tooltip: Conflicts with approved sources
resources:
  - key: main
    path: src/frontend/index.tsx
permissions:
  scopes:
    - read:page:confluence
    - read:space:confluence
    - read:user:confluence
    - read:content.metadata:confluence
    - storage:app
app:
  runtime:
    name: nodejs22.x
  # `forge register` replaces this placeholder with the real app id. Do not commit a real id.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
