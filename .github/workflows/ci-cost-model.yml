name: cost-model

on:
  pull_request:
    paths:
      - "tools/cost-model/**"
      - ".github/workflows/ci-cost-model.yml"
  push:
    branches: [main]
    paths:
      - "tools/cost-model/**"
      - ".github/workflows/ci-cost-model.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # Action majors are pinned from memory (ASSUMED); bump them if "Set up job" cannot resolve one.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tools/cost-model/tests -v
      - name: SENSITIVITY.md is up to date
        run: python tools/cost-model/run.py --check
