name: competitor-watch-tests

on:
  pull_request:
    paths:
      - "tools/competitor-watch/**"
      - ".github/workflows/ci-competitor-watch.yml"
      - ".github/workflows/competitor-watch.yml"
  push:
    branches: [main]
    paths:
      - "tools/competitor-watch/**"
      - ".github/workflows/ci-competitor-watch.yml"
      - ".github/workflows/competitor-watch.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (fixtures are synthetic; a local HTTP server stands in for the network)
        run: python -m unittest discover -s tools/competitor-watch/tests -v
      - name: sources.json is valid
        run: python tools/competitor-watch/watch.py check-config
      - name: The workflow files are valid YAML
        run: |
          python -m pip install --quiet pyyaml
          python -c "import yaml,sys; [yaml.safe_load(open(f)) for f in ('.github/workflows/competitor-watch.yml', '.github/workflows/ci-competitor-watch.yml')]; print('yaml ok')"
